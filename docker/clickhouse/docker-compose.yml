services:
  clickhouse:
    image: clickhouse:25.11.3.54
    container_name: ck
    restart: always
    network_mode: host
    user: "${CLICKHOUSE_UID}:${CLICKHOUSE_GID}"
    # ports:
    #   - "8123:8123"
    #   - "9000:9000"
    #   - "9004:9004"
    volumes:
      - /opt/clickhouse/data:/var/lib/clickhouse/
      - /opt/clickhouse/logs:/var/log/clickhouse-server/
      - ./etc/config.d:/etc/clickhouse-server/config.d:ro
      - ./etc/users.d:/etc/clickhouse-server/users.d/:ro
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d/:ro
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
      - CLICKHOUSE_UID=${CLICKHOUSE_UID}
      - CLICKHOUSE_GID=${CLICKHOUSE_GID}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

