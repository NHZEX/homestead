services:
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v3.30.1
    restart: unless-stopped
    environment:
      - IMGPROXY_BIND=:8236
      - IMGPROXY_MAX_SRC_FILE_SIZE=0
      - IMGPROXY_MAX_SRC_RESOLUTION=200
      - IMGPROXY_TIMEOUT=45
      # 安全配置（建议生产环境使用）
      #- IMGPROXY_KEY=${IMGPROXY_KEY}  # 用于签名URL的密钥
      #- IMGPROXY_SALT=${IMGPROXY_SALT} # 用于签名URL的盐值
      # 缓存配置
      - IMGPROXY_USE_ETAG=true
      - IMGPROXY_USE_LAST_MODIFIED=true
      - IMGPROXY_USE_FILE_SYSTEM_CACHE=true
      - IMGPROXY_FILE_SYSTEM_CACHE_DIRECTORY=/tmp/imgproxy-cache
      - IMGPROXY_CACHE_SIZE=${IMGPROXY_CACHE_SIZE:-512} # 缓存大小（MB）
      - IMGPROXY_CACHE_TTL=${IMGPROXY_CACHE_TTL:-86400} # 缓存时间（秒）
      # 日志配置
      - IMGPROXY_LOG_FORMAT=pretty
      - IMGPROXY_LOG_LEVEL=${IMGPROXY_LOG_LEVEL:-info}
      # 性能配置
      - IMGPROXY_MALLOC=tcmalloc
    volumes:
      - /tmp/imgproxy-cache:/tmp/imgproxy-cache
    ports:
      - "8236:8236"
    healthcheck:
      test: [ "CMD", "imgproxy", "health" ]
      interval: 10s
      timeout: 10s
      retries: 3
